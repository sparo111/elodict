<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elodict</title>
<style>
  .dedication { text-align: center; font-style: italic; font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; font-size: 14pt; margin: 0 0 2mm; }
  .what { border: 2px solid #111; border-radius: 3mm; padding: 2mm 4mm; margin-bottom: 2mm; font-size: 14.5pt; }
  .what h2 { border: 0; padding: 0; margin: 0 0 1.5mm; }
  .what ul { margin: 0; padding-left: 6mm; }
  .what li { margin-bottom: 0.8mm; }
  @page { size: A4; margin: 8mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #111; background: #fff; font-size: 15pt; line-height: 1.25; }
  main { max-width: 190mm; margin: 0 auto; padding: 2mm; }
  h1 { font-size: 24pt; margin: 0 0 1mm; }
  h2 { font-size: 16pt; margin: 2mm 0 1mm; border-top: 2px solid #111; padding-top: 2mm; }
  p { margin: 0 0 2mm; }
  ol { margin: 0; padding-left: 9mm; font-size: 13pt; }
  li { margin-bottom: 0.8mm; }
  .note { font-size: 14pt; }
  .langs { margin-bottom: 4mm; font-size: 14pt; }
  .langs a { margin-right: 4mm; color: #111; }
  button { font-size: 14pt; padding: 3mm 6mm; margin-top: 3mm; }
  [hidden] { display: none; }
  @media print { .langs, button { display: none; } }
</style>
</head>
<body>
<main>
  <nav class="langs" aria-label="Lingua">
    <a href="?lang=it">Italiano</a><a href="?lang=en">English</a><a href="?lang=fr">Français</a><a href="?lang=es">Español</a>
  </nav>
  <h1 id="title"></h1>
  <p class="dedication" id="dedication"></p>
  <section class="what" aria-labelledby="what-title"><h2 id="what-title"></h2><ul id="what-list"></ul></section>
  <p id="intro"></p>
  <section><h2 id="h-pc"></h2><ol id="pc"></ol></section>
  <section><h2 id="h-android"></h2><ol id="android"></ol></section>
  <section><h2 id="h-iphone"></h2><ol id="iphone"></ol></section>
  <p class="note" id="foot"></p>
  <button type="button" id="print"></button>
</main>
<script src="installa-testi.js"></script>
<script>
(function () {
  var T = {

      pc: "Sul computer (Windows o Mac)", android: "Sul telefono Android", iphone: "Su iPhone o iPad",
      pcS: ["Apri il link che ti hanno mandato, con Chrome o Edge.", "Premi il pulsante grande «Installa Elodict».", "Premi «Installa» nella finestra che si apre.", "Trovi l'icona sul desktop. Premila per aprire Elodict."],
      anS: ["Apri il link con Chrome.", "Premi «Installa Elodict».", "Premi «Installa».", "L'icona è nella schermata dei tuoi programmi."],
      ipS: ["Apri il link con Safari (la bussola blu).", "Premi il tasto Condividi: un quadrato con una freccia in su.", "Scorri e premi «Aggiungi alla schermata Home».", "Premi «Aggiungi» in alto a destra."],
      foot: "Se non vedi il pulsante, Elodict si può usare lo stesso: basta tenere aperta la pagina.", print: "Stampa questa pagina"
    },
    en: {

      pc: "On a computer (Windows or Mac)", android: "On an Android phone", iphone: "On an iPhone or iPad",
      pcS: ["Open the link you were sent, with Chrome or Edge.", "Press the big button «Install Elodict».", "Press «Install» in the window that opens.", "The icon is on your desktop. Press it to open Elodict."],
      anS: ["Open the link with Chrome.", "Press «Install Elodict».", "Press «Install».", "The icon is on your apps screen."],
      ipS: ["Open the link with Safari (the blue compass).", "Press the Share button: a square with an arrow pointing up.", "Scroll and press «Add to Home Screen».", "Press «Add» at the top right."],

      foot: "Si le bouton n'apparaît pas, vous pouvez quand même utiliser Elodict : gardez simplement la page ouverte.", print: "Imprimer cette page"
    },
    es: {

      pc: "En el ordenador (Windows o Mac)", android: "En un teléfono Android", iphone: "En iPhone o iPad",

  var lang = T[q] ? q : (T[(navigator.language || "it").slice(0, 2)] ? (navigator.language || "it").slice(0, 2) : "it");
  var t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  function fill(id, items) {
    var el = document.getElementById(id);
    items.forEach(function (x) { var li = document.createElement("li"); li.textContent = x; el.appendChild(li); });
  }
  function text(id, v) { document.getElementById(id).textContent = v; }
  text("title", t.title); text("intro", t.intro);
  text("h-pc", t.pc); text("h-android", t.android); text("h-iphone", t.iphone);
  fill("pc", t.pcS); fill("android", t.anS); fill("iphone", t.ipS);
  var w = (window.ELODICT_WHAT || {})[lang];
  if (w) { text("dedication", w.dedication); text("what-title", w.title); fill("what-list", w.items); } else { document.querySelector(".what").hidden = true; }
  text("foot", t.foot); text("print", t.print);
  document.getElementById("print").addEventListener("click", function () { window.print(); });
})();
</script>
</body>
</html>
