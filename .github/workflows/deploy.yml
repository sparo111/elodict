# Pubblica Elodict su GitHub Pages (gratis, con https) ogni volta che si aggiorna il ramo principale.
# Non usa nessun segreto: serve solo il permesso di pubblicare le pagine, dato qui sotto.
name: Pubblica Elodict

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prove automatiche sulla logica, con le soglie di copertura
        run: npm run coverage
      - name: Costruisce l'app (l'indirizzo contiene il nome del repository)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Controlla che nella versione pubblicata non ci siano agganci per le prove
        run: npm run check:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
